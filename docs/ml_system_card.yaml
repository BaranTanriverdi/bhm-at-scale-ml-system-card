mlCore:
  artifactURIs:
    dockerImage: ''
    model: data/result/optim_state.pickle
  baselines:
    - >-
      Scikit-Learn LinearRegression fitted on log-transformed sales for a single store as a conventional Poisson-style
      regression baseline, compared against the Bayesian hierarchical model.
  datasets:
    - license: See Kaggle dataset page
      name: Rossmann Store Sales (Kaggle)
      uri: https://www.kaggle.com/pratyushakar/rossmann-store-sales
  failureModes:
    - >-
      The model assumes that relationships between features (such as weekday, promotions, and holidays) and log sales
      are relatively stable over the training and forecasting horizons; it may underperform under strong distribution
      shifts not represented in the Rossmann training data.
    - >-
      Features are padded with zeros for missing values in the cube (via jnp.nan_to_num), and closed days have Sales set
      to NaN before filtering; unexpected patterns of missingness or mis-specified closed days may lead to biased
      estimates.
    - >-
      Local_guide-based adaptation for new stores with few observations relies on the global priors learned from
      historical stores; if new stores differ substantially in behaviour from the training population, forecasts may be
      miscalibrated.
  features:
    - 'DayOfWeek_1–DayOfWeek_7: dummy-encoded weekday indicators derived from the original DayOfWeek column.'
    - 'Promo: binary indicator of whether a promotion is running on a given day.'
    - 'StateHoliday_0–StateHoliday_3: dummy-encoded state holiday categories mapped from the original StateHoliday field.'
    - 'SchoolHoliday: indicator for school holidays.'
    - 'Promo2: indicator for a secondary promotion program.'
    - >-
      StoreVariant_11, StoreVariant_13, StoreVariant_21, StoreVariant_22, StoreVariant_23, StoreVariant_31,
      StoreVariant_33, StoreVariant_41, StoreVariant_43: categorical encodings combining StoreType and Assortment into
      store variant groups.
    - 'StoreId: contiguous numeric identifier for each store, used as an index dimension in the cube.'
    - 'Timestep: per-store time index (within-store cumulative day count).'
    - 'Sales: target variable representing daily store sales, modelled as a Gamma-Poisson count.'
  problem: >-
    Probabilistic time-series regression / forecasting of daily store-level sales counts using a Gamma-Poisson
    hierarchical model over stores, days, and engineered features.
  qualities: []
  training:
    framework: NumPyro (JAX)
    frameworkVersion: 0.7.2
    hardware: >-
      Local Python 3.8 environment (Conda) with JAX 0.2.19 / jaxlib 0.1.71 and NumPyro 0.7.2, suitable for CPU-based SVI
      training.
    hyperparams:
      batching: full-batch over all stores and days in X
      fine_tuning:
        lr: 0.001
        n_epochs: 1000
      initial_training:
        lr: 0.1
        n_epochs: 5000
      local_adaptation:
        lr: 0.1
        n_epochs: 1000
      optimizer: Adam via numpyro.optim
      svi_loss: Trace_ELBO(num_particles=1)
