business:
  executiveSummary: >-
    This project implements Bayesian hierarchical modelling at scale for retail sales forecasting. Using NumPyro on top
    of JAX, it fits a Gamma-Poisson hierarchical model over thousands of stores and days in the Rossmann Store Sales
    dataset from Kaggle. The pipeline downloads raw store and sales CSVs, performs feature engineering and
    dummy-encoding in pandas, and converts them into a time-series cube suitable for vectorized probabilistic inference.
    The resulting model captures global and store-specific effects (such as weekday, promotions, and holidays), produces
    posterior predictive distributions, and is compared against a conventional linear regression baseline.
  hazardousUseCases:
    - >-
      Using the research code and model outputs directly for safety-critical or legally binding decisions (for example,
      staffing of emergency services or credit approvals) without additional validation, governance, and monitoring.
    - >-
      Relying on forecasts trained on the Rossmann Store Sales dataset to drive high-stakes decisions in domains
      unrelated to retail store sales, where the data distribution and risks differ substantially.
  intendedUse: >-
    The primary intended use is as a research and educational example of scalable Bayesian hierarchical modelling for
    count time-series, demonstrating how to implement a Gamma-Poisson hierarchical model with NumPyro and JAX on the
    Rossmann store-level sales task. It is designed for experimentation in notebooks rather than for direct production
    deployment.
  kpis: []
  nonGoals:
    - Providing a fully production-ready forecasting service or API for retail operations.
    - Building a generic forecasting platform applicable to arbitrary domains beyond the Rossmann Store Sales example.
    - >-
      Delivering a comprehensive MLOps stack with monitoring, retraining, and automated deployment; the focus is on
      modelling and experimentation in notebooks.
  outOfScopeUse:
    - >-
      Directly deploying this example codebase in a production environment without additional engineering, testing, and
      monitoring.
    - >-
      Using the model outside the context of historical store-level sales data with similar structure to the Rossmann
      Store Sales dataset, for example on domains with very different feature semantics.
    - >-
      Treating the example changelog and documentation templates as production governance records without
      project-specific adaptation.
  useCase: >-
    Forecasting daily store-level sales for a retail chain using a Bayesian hierarchical Gamma-Poisson model, trained on
    the Rossmann Store Sales Kaggle dataset, to capture both global effects (such as weekday and promotions) and
    store-specific patterns.
  userPopulations:
    - >-
      Data scientists and researchers interested in Bayesian hierarchical modelling and probabilistic programming with
      NumPyro and JAX.
    - >-
      Machine learning practitioners who want to study scalable approaches to count time-series forecasting on retail
      sales data.
    - >-
      Students and readers of the accompanying blog post who run the notebooks to understand the modelling and inference
      pipeline.
devInsight:
  architecture:
    dataFlow:
      - >-
        Raw Rossmann Store Sales CSVs (store.csv, train.csv) are downloaded from Kaggle into data/raw using
        kaggle.api.dataset_download_files in the preprocessing notebook.
      - >-
        store.csv and train.csv are loaded into pandas, merged on Store, sorted by Store and Date, and augmented with
        engineered fields such as numeric StateHoliday, Assortment, StoreType, StoreId, Timestep, and StoreVariant while
        dropping unused competition and promo interval columns.
      - >-
        Categorical variables (DayOfWeek, StoreVariant, StateHoliday) are dummy-encoded via
        bhm_at_scale.preprocess.encode; rows with Open == 0 have Sales set to NaN, and Open is then dropped before
        columns are reordered to put StoreId and Timestep first and Sales last.
      - >-
        The encoded DataFrame is saved to data/preprocessed/edf.csv and converted into a three-dimensional numpy array
        cube X indexed by [StoreId, Timestep, feature/target] using bhm_at_scale.preprocess.make_cube; X is split into
        X_train and X_test and persisted as .npz files.
      - >-
        X_train and X_test are loaded as JAX DeviceArray objects and passed to the Gamma-Poisson hierarchical model
        defined in bhm_at_scale.model via the ModelHandler.fit SVI training loop, which performs JAX-jitted optimization
        using lax.fori_loop.
      - >-
        After training, optimizer/model state is serialized to data/result/optim_state.pickle; posterior samples and
        predictions are generated with ModelHandler.predict and predictive_model, summarized via
        bhm_at_scale.utils.summary, stats_to_df, and preds_to_df, and exported as CSVs (e.g., coef_mus.csv, stats.csv,
        train_preds.csv, test_preds.csv) for downstream visualization in notebooks and bhm_at_scale.plot.
    depsSummary:
      - 'Core language and environment: Python >=3.8 managed via Conda (environment.yaml, environment.lock.yaml).'
      - >-
        Numerical and data processing: numpy, scipy, pandas (for array math, statistics, and tabular feature
        engineering).
      - 'Probabilistic modelling and optimization: jax, jaxlib, numpyro (Gamma-Poisson hierarchical model, SVI, JAX JIT).'
      - >-
        Classical machine learning baseline: scikit-learn (LinearRegression used as a conventional Poisson-style
        regression comparator).
      - >-
        Visualization and reporting: matplotlib, seaborn, daft (for plotting time series, densities, and graphical model
        diagrams).
      - >-
        Experiment tooling and data access: jupyterlab for notebooks and kaggle API for downloading the Rossmann Store
        Sales dataset.
