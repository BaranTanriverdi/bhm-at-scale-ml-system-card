  codeOverview:
    components:
      - keyFiles:
          - notebooks/01-preprocessing.ipynb
          - src/bhm_at_scale/preprocess.py
          - src/bhm_at_scale/utils.py
        name: Data Preprocessing
        summary: >-
          Downloads the Rossmann Store Sales Kaggle dataset, cleans and merges store metadata, performs basic feature
          engineering and dummy-encoding of categorical variables, and constructs a time-series cube for model input.
      - keyFiles:
          - src/bhm_at_scale/model.py
          - notebooks/02-model.ipynb
        name: Hierarchical Sales Model
        summary: >-
          Defines a Gamma-Poisson hierarchical model over stores, days, and features using NumPyro plates, along with
          corresponding guides and a predictive model for posterior sampling.
      - keyFiles:
          - src/bhm_at_scale/handler.py
          - notebooks/02-model.ipynb
        name: Training & Inference Handler
        summary: >-
          Wraps NumPyro SVI with a ModelHandler class that manages JAX PRNG keys, optimizer construction, JIT-compiled
          training loops, checkpointing of optimizer state, and prediction via Predictive.
      - keyFiles:
          - src/bhm_at_scale/plot.py
          - notebooks/03-evaluation.ipynb
          - notebooks/02-model.ipynb
        name: Visualization & Evaluation
        summary: >-
          Provides utilities and notebooks to visualize predictive performance, uncertainty intervals, global weekday
          and promotion effects, and to compare the hierarchical model to a scikit-learn linear regression baseline.
    entrypoints:
      - >-
        Running Jupyter notebooks in notebooks/01-preprocessing.ipynb, 02-model.ipynb, and 03-evaluation.ipynb to
        execute the full data-to-model-to-evaluation pipeline.
      - >-
        Importing bhm_at_scale.handler.ModelHandler together with bhm_at_scale.model.model and bhm_at_scale.model.guide
        to train the hierarchical model from Python code.
      - >-
        Using bhm_at_scale.preprocess.encode and bhm_at_scale.preprocess.make_cube to transform tabular store-level
        sales data into model-ready arrays.
      - >-
        Using bhm_at_scale.plot.PlotStore and bhm_at_scale.plot.plot_sales_preds to visualize sales histories and
        predictive intervals for individual stores.
    languages:
      - Python
  qualitySignals:
    complexityHints:
      - >-
        The training loop in ModelHandler._fit uses JAX JIT compilation and lax.fori_loop over epochs, indicating
        careful optimization for performance on large time-series cubes.
      - >-
        The Gamma-Poisson hierarchical model employs multiple NumPyro plates (features, stores, days) and
        TransformReparam with TransformedDistribution to stabilize inference, which increases conceptual and
        implementation complexity.
      - >-
        Custom guides (global guide and local_guide) are defined to handle scenarios with full historical data and new
        stores with limited history, reflecting non-trivial inference design.
